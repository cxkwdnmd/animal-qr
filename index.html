
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>动物骨骼标本查询系统</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f5f5f5;
      padding: 20px;
    }

    h1 {
      color: #333;
    }

    img {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <h1 id="title">动物骨骼标本查询系统</h1>

  <img id="animalImage" alt="动物骨骼图片">

  <script>
    const animals = {
      pig: "猪",
      cow: "牛",
      sheep: "羊",
      horse: "马",
      dog: "狗",
      chicken: "鸡"
    };

    const params = new URLSearchParams(
      window.location.search
    );

    const animal = params.get("animal");

    if (animals[animal]) {
      document.getElementById("title")
        .textContent = animals[animal] + "骨骼标本";

      document.getElementById("animalImage")
        .src = "images/" + animal + ".jpg";
    } else {
      document.getElementById("title")
        .textContent = "请选择动物";
      document.getElementById("animalImage")
        .style.display = "none";
    }
  </script>

</body>
</html>
