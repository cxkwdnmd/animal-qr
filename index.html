<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>动物骨骼标本展示</title>
  <script type="module" src="./js/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f7f9; color: #202124; font-family: system-ui, -apple-system, 'Microsoft YaHei', sans-serif; }
    header { padding: 18px 16px; text-align: center; background: white; box-shadow: 0 1px 6px #00000012; }
    h1 { font-size: 22px; margin: 0; }
    .wrap { max-width: 960px; margin: 20px auto; padding: 0 12px; }
    model-viewer { display: block; width: 100%; height: min(75vh, 740px); min-height: 420px; background: #e9edf1; border-radius: 14px; }
    img { display: block; width: 100%; max-height: 75vh; object-fit: contain; background: white; border-radius: 14px; }
    .hint { text-align: center; color: #555; font-size: 14px; line-height: 1.7; }
    .error { color: #b3261e; }
    #diagnostics { margin: 18px 0; padding: 12px; background: #fff; border: 1px solid #ddd; border-radius: 10px; font: 12px/1.6 monospace; overflow-wrap: anywhere; white-space: pre-wrap; }
    #diagnostics:empty { display:none; }
  </style>
</head>
<body>
  <header><h1 id="title">动物骨骼标本展示</h1></header>
  <main class="wrap">
    <div id="content"></div>
    <p id="hint" class="hint"></p>
    <div id="diagnostics" aria-live="polite"></div>
  </main>
  <script>
    const diagnostics = document.getElementById('diagnostics');
    const started = Date.now();
    function log(message) {
      diagnostics.textContent += `[${((Date.now()-started)/1000).toFixed(1)}s] ${message}\n`;
    }
    window.addEventListener('error', e => log('JS错误: ' + (e.message || '未知') + ' ' + (e.filename || '')));
    window.addEventListener('unhandledrejection', e => log('Promise错误: ' + String(e.reason?.message || e.reason || '未知')));
    try {
      const c = document.createElement('canvas');
      log('WebGL: ' + (c.getContext('webgl2') ? 'WebGL2可用' : c.getContext('webgl') ? 'WebGL1可用' : '不可用'));
    } catch (e) { log('WebGL检测错误: ' + e.message); }
    log('浏览器: ' + navigator.userAgent);
    const animals = { pig:'猪', cow:'牛', sheep:'羊', horse:'马', dog:'狗', chicken:'鸡' };
    const animal = new URLSearchParams(location.search).get('animal');
    const title = document.getElementById('title');
    const content = document.getElementById('content');
    const hint = document.getElementById('hint');
    if (!animals[animal]) {
      title.textContent = '请选择动物';
      hint.textContent = '网址示例：?animal=chicken';
    } else {
      title.textContent = animals[animal] + '骨骼标本';
      if (animal === 'chicken') {
        const viewer = document.createElement('model-viewer');
        viewer.setAttribute('src', 'models/chicken.glb');
        viewer.setAttribute('alt', '鸡的三维解剖模型');
        viewer.setAttribute('camera-controls', '');
        viewer.setAttribute('auto-rotate', '');
        viewer.setAttribute('shadow-intensity', '0.7');
        viewer.setAttribute('interaction-prompt', 'auto');
        viewer.addEventListener('load', () => { log('模型load事件：成功'); hint.textContent = '3D模型加载成功 · 单指旋转 · 双指缩放'; });
        viewer.addEventListener('error', (event) => {
          log('模型error事件: ' + (event.detail?.type || '未提供类型'));
          hint.textContent = '3D加载失败，详细信息见下方诊断记录。';
          hint.classList.add('error');
        });
        viewer.addEventListener('progress', (event) => {
          const p = event.detail?.totalProgress;
          if (typeof p === 'number' && (p === 1 || p < 0.02 || Math.round(p * 100) % 25 === 0)) {
            const pct = Math.round(p * 100);
            if (viewer.dataset.lastProgress !== String(pct)) { viewer.dataset.lastProgress = String(pct); log('模型加载进度: ' + pct + '%'); }
          }
        });
        window.addEventListener('load', () => {
          setTimeout(() => log('model-viewer已注册: ' + Boolean(customElements.get('model-viewer'))), 1500);
          setTimeout(() => {
            if (!viewer.loaded) log('15秒后模型仍未完成加载（可能是网络慢，也可能加载失败）');
          }, 15000);
        });
        content.appendChild(viewer);
        hint.textContent = '单指拖动旋转 · 双指缩放 · 可用手势调整视角';
      } else {
        const img = document.createElement('img');
        img.src = `images/${animal}.jpg`;
        img.alt = `${animals[animal]}骨骼图片`;
        img.addEventListener('error', () => {
          hint.textContent = '图片加载失败，请检查 images 文件夹和图片文件名。';
          hint.classList.add('error');
        });
        content.appendChild(img);
        hint.textContent = '当前为图片展示，3D模型后续更新。';
      }
    }
  </script>
</body>
</html>
